media:
  input: public/images 
  output: /images 

content:
  # 1. ARQUIVO DE CONFIGURAÇÃO (Editado como código bruto)
  - name: config
    label: Configurações do Astro
    type: file
    path: astro.config.mjs
    fields:
      # O campo 'body' captura todo o conteúdo do arquivo
      - name: body
        label: Código do astro.config.mjs
        type: code

  # 2. PÁGINA PRINCIPAL (index.mdx)
  - name: homepage
    label: Página Principal (Home)
    type: file
    path: src/content/docs/index.mdx
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descrição
        type: string
      - name: template
        label: Template (Layout)
        type: string
      - name: hero
        label: Hero Section
        type: object
        fields:
          - name: tagline
            label: Slogan (Tagline)
            type: string
          - name: image
            label: Imagem do Hero
            type: object
            fields:
              - name: file
                label: Caminho do Arquivo
                type: string
      - name: body
        label: Corpo do Texto
        type: rich-text

  # 3. RESTANTE DA DOCUMENTAÇÃO
  - name: docs
    label: Documentação Starlight
    type: collection
    path: src/content/docs
    # Ignora o index.mdx aqui para evitar duplicação com a seção acima
    exclude:
      - index.mdx
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descrição
        type: string
      - name: body
        label: Corpo do Texto
        type: rich-text