media:
  input: public/images
  output: /images

content:
  - name: docs
    label: Páginas e Documentação
    type: collection
    path: src/content/docs
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descrição
        type: string

      # FRONTMATTER DA SIDEBAR (Para as páginas de documentação)
      - name: sidebar
        label: Configuração da Sidebar (Frontmatter)
        type: object
        fields:
          - name: label
            label: Nome no Menu
            type: string
          - name: order
            label: Ordem (Ex: 1, 2, 3)
            type: number
          - name: hidden
            label: Ocultar do Menu?
            type: boolean

      # FRONTMATTER DA HOME (Para o index.mdx)
      - name: template
        label: Template (Digite 'splash' para a Home)
        type: string
      - name: hero
        label: Hero Section (Apenas Home)
        type: object
        fields:
          - name: tagline
            label: Slogan
            type: string
          - name: image
            label: Imagem
            type: object
            fields:
              - name: file
                label: Caminho do Arquivo
                type: string

      - name: body
        label: Corpo do Texto
        type: rich-text