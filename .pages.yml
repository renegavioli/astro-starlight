media:
  folder: public/images
  public: /images

content:
  - name: home
    label: Página Inicial
    file: src/content/docs/index.mdx
    fields:
      - name: title
        label: Título da Página
        type: string
      - name: description
        label: Descrição
        type: string
      - name: body
        label: Conteúdo Principal
        type: rich-text

  - name: docs
    label: Páginas de Conteúdo
    folder: src/content/docs
    fields:
      - name: title
        label: Título da Página
        type: string
        required: true
      - name: description
        label: Descrição
        type: string
      - name: sidebar
        label: Comportamento no Menu (Sidebar)
        type: object
        fields:
          - name: label
            label: Texto no Menu (Label)
            type: string
          - name: order
            label: Posição (Order)
            type: number
          - name: hidden
            label: Ocultar do Menu (Hide)
            type: boolean
          - name: badge
            label: Etiqueta (Badge)
            type: string
      - name: body
        label: Conteúdo da Página
        type: rich-text