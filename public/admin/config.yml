# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: renegavioli/astro-starlight
  branch: main # Mude para master se for o caso no seu repositório

# Os caminhos de repositório não devem ter a barra inicial (/)
media_folder: public/media
public_folder: /media

collections:
  - name: docs
    label: Docs
    label_singular: Doc
    folder: src/content/docs
    create: true
    slug: "{{slug}}"
    format: frontmatter
    extension: md # Starlight utiliza muito MDX. Pode alterar para md se preferir
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      
      # -- FRONTMATTER DA SIDEBAR --
      - label: Sidebar
        name: sidebar
        widget: object
        required: false
        fields:
          - { label: Label, name: label, widget: string, required: false }
          - { label: Order, name: order, widget: number, value_type: int, required: false }
          - { label: Hidden, name: hidden, widget: boolean, required: false }

      # -- FRONTMATTER DA HOME --
      - { label: Template, name: template, widget: string, required: false, hint: "Digite 'splash' para a Home" }
      - label: Hero
        name: hero
        widget: object
        required: false
        fields:
          - { label: Tagline, name: tagline, widget: string, required: false }
          - label: Image
            name: image
            widget: object
            required: false
            fields:
              - { label: File, name: file, widget: string, required: false }
              
      # -- CONTEÚDO PRINCIPAL --
      # Sveltia/Decap usam 'markdown' como o widget padrão para o corpo do texto
      - { label: Body, name: body, widget: markdown }
