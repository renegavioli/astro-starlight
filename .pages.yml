media:
  input: public
  output: /

content:
  - name: home
    label: Página Inicial
    type: file
    path: src/content/docs/index.mdx
    fields:
      - name: title
        label: Título
        type: string
      - name: description
        label: Descrição
        type: string
      - name: hero
        label: Hero (Destaque)
        type: object
        fields:
          - name: tagline
            label: Tagline
            type: string
          - name: image
            label: Imagem
            type: object
            fields:
              - name: file
                label: Arquivo de Imagem
                type: image
              - name: alt
                label: Texto Alternativo
                type: string
          - name: actions
            label: Botões (Actions)
            type: object
            list: true
            fields:
              - name: text
                label: Texto do Botão
                type: string
              - name: link
                label: Link
                type: string
              - name: icon
                label: Ícone
                type: string
              - name: variant
                label: Variante (primary / secondary)
                type: string
      - name: cards
        label: Cards de Funcionalidades
        type: object
        list: true
        fields:
          - name: title
            label: Título do Card
            type: string
          - name: icon
            label: Ícone
            type: string
          - name: description
            label: Descrição do Card
            type: string
      - name: body
        label: Conteúdo Adicional
        type: rich-text

  - name: docs
    label: Páginas de Conteúdo
    type: collection
    path: src/content/docs
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descrição
        type: string
      - name: sidebar
        label: Configuração da Sidebar
        type: object
        fields:
          - name: label
            label: Texto no Menu (Label)
            type: string
          - name: order
            label: Ordem (Order)
            type: number
          - name: hidden
            label: Ocultar (Hide)
            type: boolean
          - name: badge
            label: Etiqueta (Badge)
            type: string
      - name: body
        label: Conteúdo
        type: rich-text