content:
  - name: home
    label: Página Inicial
    type: file
    path: src/content/docs/index.mdx
    fields:
      - name: title
        label: Título da Página
        type: string
      - name: description
        label: Descrição
        type: string
      
      # --- MAPEAMENTO DO COMPONENTE HERO ---
      - name: hero
        label: Bloco Hero (Destaque Principal)
        type: object
        fields:
          - name: tagline
            label: Subtítulo (Tagline)
            type: string
            
          - name: image
            label: Imagem em Destaque
            type: object
            fields:
              - name: file
                label: Arquivo de Imagem
                type: image
              - name: alt
                label: Texto Alternativo (Acessibilidade)
                type: string
                
          - name: actions
            label: Botões de Ação
            type: object
            list: true # Isso transforma o objeto em um array (lista) de botões
            fields:
              - name: text
                label: Texto do Botão
                type: string
              - name: link
                label: Link de Destino
                type: string
              - name: variant
                label: Estilo do Botão
                type: select
                options:
                  - primary
                  - secondary
                  - minimal
              - name: icon
                label: Ícone (Ex: right-arrow, external)
                type: string
      # -------------------------------------
      
      - name: body
        label: Conteúdo Principal
        type: rich-text