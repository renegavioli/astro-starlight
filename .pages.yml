media:
  input: public/images
  output: /images

content:
  # 1. GERENCIAMENTO DA SIDEBAR
  - name: sidebar
    label: Menu Lateral (Sidebar)
    type: file
    path: src/sidebar.json
    fields:
      - name: menu
        label: Grupos de Documentação
        type: list
        fields:
          - name: label
            label: Nome da Seção (Ex: Protocolos CARDIO)
            type: string
          - name: directory
            label: Nome da Pasta (Ex: protocolos)
            type: string

  # 2. EDIÇÃO DA PÁGINA PRINCIPAL (Home)
  - name: homepage
    label: Página Inicial
    type: file
    path: src/content/docs/index.mdx
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descrição
        type: string
      - name: template
        label: Template
        type: string
      - name: hero
        label: Hero Section
        type: object
        fields:
          - name: tagline
            label: Slogan
            type: string
          - name: image
            label: Imagem
            type: object
            fields:
              - name: file
                label: Caminho da Imagem
                type: string
      - name: body
        label: Corpo do Texto
        type: rich-text

  # 3. EDIÇÃO DAS PÁGINAS DE DOCUMENTAÇÃO
  - name: docs
    label: Documentação
    type: collection
    path: src/content/docs
    exclude:
      - index.mdx
    fields:
      - name: title
        label: Título da Página
        type: string
        required: true
      - name: description
        label: Descrição
        type: string
      - name: body
        label: Conteúdo
        type: rich-text